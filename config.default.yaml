# ============================================================
# AshChan Bot - 設定テンプレート
# ------------------------------------------------------------
# 初回に start.bat を実行すると、このファイルが config.yaml として
# コピーされます。編集するのは config.yaml の方です。
# （config.default.yaml は更新時の参考用に残しておいてください）
#
# ■ Discord の ID の取り方
#   1. Discord の「ユーザー設定 → 詳細設定 → 開発者モード」を ON
#   2. チャンネル / ロール / ユーザーを右クリック →「IDをコピー」
#   3. ID は数字のまま（クォート不要）で書けばOK。例: 123456789012345678
#
# ■ 書式の注意
#   - リストは [] か、行頭 "- " で列挙します
#   - 文字列中に : や # を含む場合は "..." で囲んでください
# ============================================================


# ============================================================
# Discord 接続設定
# ============================================================
discord:
  # Discord Developer Portal → Applications → Bot → 「Reset Token」で発行したトークン。
  # ※ 絶対に公開・コミットしないでください（config.yaml は .gitignore 済み）
  # ※ 環境変数 ASH_DISCORD_TOKEN が設定されていればそちらが優先されます
  # 型: 文字列 / 必須
  token: ""

  # スラッシュコマンドを即時同期するサーバーIDの一覧。
  # 空 [] の場合はグローバル同期（反映まで最大1時間程度かかることがあります）。
  # 単体サーバー運用なら、そのサーバーIDを1つ入れておくのがおすすめ。
  # 型: 整数のリスト / 既定: []
  # 例: [123456789012345678]
  guild_ids: []


# ============================================================
# 通知設定
# ------------------------------------------------------------
# ボットの各種ログ・警告の送り先です。
#   dev通知    : 起動/停止、モデレーション処置、ハニーポット、アンチnuke 等すべて
#   緊急DM     : アンチnuke検知、ハニーポットBAN など即対応が必要なもののみ
# ============================================================
notify:
  # dev用通知チャンネルのID。0 の場合はコンソール（ログ）出力のみ。
  # ボットに「チャンネルを見る」「メッセージを送信」「埋め込みリンク」権限が必要です。
  # 型: 整数 / 既定: 0
  dev_channel_id: 0

  # 緊急通知をDMで送るユーザーIDの一覧（複数可）。
  # 空 [] の場合は緊急DMを送りません（dev通知のみ）。
  # ※ 相手がボットとサーバーを共有しており、DMを受け付けている必要があります。
  # 型: 整数のリスト / 既定: []
  # 例: [111111111111111111, 222222222222222222]
  emergency_dm_user_ids: []


# ============================================================
# LLM（アッシュの会話）設定 - NVIDIA NIM
# ------------------------------------------------------------
# ボットへのメンション、またはボットの発言へのリプライに応答します。
# NIM は OpenAI 互換 API なので、base_url を変えれば他の互換APIでも動きます。
# ============================================================
llm:
  # NVIDIA NIM の API キー（https://build.nvidia.com で発行、"nvapi-..." で始まる）。
  # ※ 絶対に公開しないでください
  # ※ 環境変数 NVIDIA_API_KEY が設定されていればそちらが優先されます
  # 型: 文字列 / 必須
  api_key: ""

  # API のベースURL。通常は変更不要。
  # 型: 文字列 / 既定: "https://integrate.api.nvidia.com/v1"
  base_url: "https://integrate.api.nvidia.com/v1"

  # 優先して使うモデル名。build.nvidia.com のモデルページに書かれている ID を指定。
  # Web検索（search.enabled）を使う場合は Tool Calling 対応モデルが必要です。
  # 型: 文字列 / 既定: "meta/llama-3.3-70b-instruct"
  # 例: "deepseek-ai/deepseek-v3.1"
  model: "meta/llama-3.3-70b-instruct"

  # モデルフォールバック（上から順に試す）。model が失敗（混雑・5xx・タイムアウト等）したら次へ。
  # model と同じ ID は重複排除される。空 [] ならフォールバックなし。
  # 型: 文字列のリスト / 既定: []
  # 例:
  #   models:
  #     - "deepseek-ai/deepseek-v3.1"
  #     - "meta/llama-3.3-70b-instruct"
  models: []

  # システムプロンプト（キャラ設定）のファイルパス。config.yaml からの相対パス。
  # /ash reload で再読込できます。
  # 型: 文字列 / 既定: "prompt.md"
  prompt_file: "prompt.md"

  # 応答のランダム性。0.0 で堅実、1.0 以上で自由奔放。
  # 型: 小数 / 既定: 0.8
  temperature: 0.8

  # 1回のLLM呼び出しで生成する最大トークン数。長文が途中で切れる場合は増やす。
  # 型: 整数 / 既定: 800
  max_tokens: 800

  # 会話履歴としてLLMに渡す直近の往復数（チャンネル単位で保存）。
  # 0 にすると毎回まっさらな状態で応答します。
  # 型: 整数 / 既定: 10
  history_turns: 10

  # 同じユーザーが続けて話しかけたときの待ち時間（秒）。
  # 待ち時間中のメンションはリアクション（⏳）で知らせて無視します。0 で無効。
  # 型: 小数 / 単位: 秒 / 既定: 5
  user_cooldown_sec: 5

  # ストリーミング中にメッセージを書き換える間隔（秒）。
  # 小さくすると滑らかになりますが、Discord の編集レート制限に近づきます。
  # 型: 小数 / 単位: 秒 / 既定: 2.0
  stream_edit_interval_sec: 2.0

  # API 応答のタイムアウト（秒）。超えるとフォールバック返信になります。
  # 型: 小数 / 単位: 秒 / 既定: 60
  timeout_sec: 60

  # NIM がエラー（タイムアウト・混雑・サーバーエラー等）のときにランダムで返す定型文。
  # dev通知は行わず、エラー内容はコンソールログにのみ記録します。
  # 空 [] にするとコード内蔵の既定文を使います。
  # 型: 文字列のリスト
  fallback_replies:
    - "ごめん、今ちょっと手が離せないや。あとでまた声かけて！"
    - "んー、今忙しいからあとでね！"
    - "ちょっと頭回ってないかも……少し待ってからもう一回言って？"
    - "今は休憩中ー。あとでちゃんと聞くから！"


# ============================================================
# Web検索（DuckDuckGo）設定
# ------------------------------------------------------------
# アッシュが「調べたほうがいい」と判断したとき、DuckDuckGo で検索して回答します。
# 検索中は、それまでの回答の末尾に indicator の文言を表示します。
# ※ llm.model が Tool Calling 対応である必要があります。
# ============================================================
search:
  # Web検索を使うかどうか。false にするとアッシュは手持ちの知識だけで答えます。
  # 型: 真偽値 / 既定: true
  enabled: true

  # 1回の検索でLLMに渡す結果の件数。
  # 型: 整数 / 既定: 5
  max_results: 5

  # 1回の返信で検索できる最大回数（検索ループ防止）。
  # 型: 整数 / 既定: 3
  max_calls_per_reply: 3

  # 検索地域。日本向けは "jp-jp"、地域指定なしは "wt-wt"。
  # 型: 文字列 / 既定: "jp-jp"
  region: "jp-jp"

  # 検索中に表示する文言。{query} が検索クエリに置き換わります。
  # ※ ボットの投稿では ":mag:" のようなショートコードは絵文字に変換されません。
  #    標準絵文字は文字そのもの（🔍 など）を直接書いてください。
  #    カスタム絵文字は "<:名前:絵文字ID>" 形式（アニメ絵文字は "<a:名前:ID>"）。
  #    絵文字IDは、Discord で「\:名前:」と送信すると確認できます。
  # 型: 文字列 / 既定: "検索中...🔍 {query}"
  indicator: "検索中...🔍 {query}"

  # 回答の末尾に参照したURLを付けるか。URL は <...> 形式で埋め込みを抑止します。
  # 型: 真偽値 / 既定: true
  show_sources: true


# ============================================================
# モデレーション設定
# ------------------------------------------------------------
# 通常メッセージを監視し、違反を検知したら「削除 + タイムアウト」します。
# 処置はすべて dev通知チャンネルに記録されます。
# 必要権限: メッセージの管理 / メンバーをタイムアウト
# ※ 連投（短時間の連続投稿）は通常会話と区別できないため検知しません。
# ============================================================
moderation:
  # モデレーション機能全体の ON/OFF。
  # 型: 真偽値 / 既定: true
  enabled: true

  # このロールを持つユーザーはモデレーション対象外（スタッフ・信頼ユーザー用）。
  # 「管理者」権限を持つユーザーは設定に関係なく常に対象外です。
  # 型: 整数のリスト / 既定: []
  exempt_role_ids: []

  # 違反時のタイムアウト時間（分）。0 にすると削除のみでタイムアウトしません。
  # 型: 整数 / 単位: 分 / 既定: 10
  timeout_minutes: 10

  # 1メッセージ内のユーザー/ロールメンション数の上限。これを超えると違反。
  # @everyone / @here も1件として数えます。0 で無効。
  # 型: 整数 / 既定: 5
  mention_limit: 5

  # Discord 招待リンクを含む投稿を削除するか。
  # 型: 真偽値 / 既定: true
  block_invites: true

  # 招待リンク検知用の正規表現（大文字小文字は無視）。
  # 型: 文字列のリスト
  invite_patterns:
    - 'discord\.gg/[\w-]+'
    - 'discord\.com/invite/[\w-]+'
    - 'discordapp\.com/invite/[\w-]+'
    - 'dsc\.gg/[\w-]+'
    - 'dis\.gd/[\w-]+'

  # 疑わしいリンク（フィッシング・IPロガー・短縮URL等）を含む投稿を削除するか。
  # 型: 真偽値 / 既定: true
  block_suspicious_links: true

  # 疑わしいリンク検知用の正規表現（大文字小文字は無視）。
  # 型: 文字列のリスト
  suspicious_link_patterns:
    # IPロガー・追跡
    - 'grabify'
    - 'iplogger'
    - 'ip(?:log|grab)'
    - 'yip\.su'
    - '2no\.co'
    # 短縮URL
    - 'bit\.ly'
    - 'tinyurl\.com'
    - 'cutt\.ly'
    - 'is\.gd'
    - 'rb\.gy'
    - 'shorturl\.at'
    - 'ow\.ly'
    - 'v\.gd'
    # Discord 偽ドメイン・ギフト詐欺
    - 'dlscord'
    - 'd1scord'
    - 'disc0rd'
    - 'discrod'
    - 'dicsord'
    - 'discorcl'
    - 'ddiscord'
    - 'discord(?:app)?[-.]?(?:gift|nitro|airdrop|verify|login|boost)'
    - 'discordgift'
    # Steam 偽ドメイン
    - 'steamcommun(?:ytu|itu|lty)'
    - 'steamcornmunity'
    - 'steamnitro'
    - 'steam-discord'
    - 'steamcommunity\.ru'
    # 危険ファイル直リンク
    - 'https?://\S+\.(?:exe|scr|bat|msi|apk)(?:\?|\s|$)'
    # IP直打ちURL
    - 'https?://\d{1,3}(?:\.\d{1,3}){3}'
    # 旧Freenom系TLD
    - 'https?://[^\s/]+\.(?:tk|ml|ga|cf|gq)(?:/|\s|$)'
    # 使い捨てファイルホスト
    - 'gofile\.io'
    - 'anonfiles'

  # NGワード（部分一致・大文字小文字無視）。主に詐欺の定型文。
  # AutoMod の keyword_rule が有効な場合、同じリストが AutoMod にも登録されます。
  # 型: 文字列のリスト
  ng_words:
    # Nitro / Discord ギフト詐欺
    - "無料ニトロ"
    - "フリーニトロ"
    - "free nitro"
    - "free discord nitro"
    - "nitro generator"
    - "catch this nitro"
    # Steam ギフト詐欺
    - "steam gift"
    - "steam is giving"
    - "無料スチーム"
    # 偽サポート・誤通報スクリプト
    - "accidentally reported"
    - "誤って通報"
    # 検証・ログイン誘導
    - "verify your account"
    - "login to claim"
    - "qr code login"
    - "スキャンしてログイン"
    # 暗号資産・ギブアウェイ
    - "free crypto"
    - "crypto giveaway"
    - "nft giveaway"
    - "connect your wallet"
    - "シードフレーズ"
    - "ウォレット接続"
    # その他定型
    - "test my game"
    - "無料ギフト"

  # ----------------------------------------------------------
  # Discord AutoMod 連携
  # 起動時に「[Ash] 」で始まる名前の AutoMod ルールを作成/更新します。
  # AutoMod はボットより先に Discord 側でブロックするので、確実性が高いです。
  # 必要権限: サーバー管理
  # ----------------------------------------------------------
  automod:
    # AutoMod 連携全体の ON/OFF。false にしても既存の [Ash] ルールは削除しません。
    # 型: 真偽値 / 既定: true
    enabled: true

    # ng_words を AutoMod のキーワードフィルターとして登録するか。
    # 型: 真偽値 / 既定: true
    keyword_rule: true

    # メンションスパム（mention_limit 超え）を AutoMod でブロックするか。
    # 型: 真偽値 / 既定: true
    mention_spam_rule: true

    # Discord 独自の「スパム疑いコンテンツ」判定を有効にするか。
    # これは投稿内容ベースの判定で、連投のレート制限ではありません。
    # 型: 真偽値 / 既定: true
    spam_rule: true


# ============================================================
# アンチnuke 設定
# ------------------------------------------------------------
# 監査ログを監視し、同じ実行者が短時間に破壊的な操作を繰り返したら
# dev通知チャンネルと緊急DM先に通知します（自動処罰は行いません）。
# 必要権限: 監査ログを表示 / 必要Intent: Server Members（moderation）
# ============================================================
antinuke:
  # アンチnuke 機能の ON/OFF。
  # 型: 真偽値 / 既定: true
  enabled: true

  # 回数を数える時間窓（秒）。この秒数内の同一実行者の操作回数で判定します。
  # 型: 整数 / 単位: 秒 / 既定: 30
  window_seconds: 30

  # 同じ実行者への通知を繰り返さない待ち時間（秒）。
  # 型: 整数 / 単位: 秒 / 既定: 300
  alert_cooldown_seconds: 300

  # 時間窓内で、この回数「以上」になったら通知する閾値。0 でその操作は監視しない。
  # 型: 整数
  thresholds:
    # チャンネル作成
    channel_create: 5
    # チャンネル削除
    channel_delete: 3
    # ロール作成
    role_create: 5
    # ロール削除
    role_delete: 3
    # BAN
    ban: 3
    # キック
    kick: 3
    # Webhook 作成
    webhook_create: 3
    # 管理者等の危険な権限を持つロールの付与・危険権限の追加（1回で即通知）
    dangerous_role_grant: 1

  # 監視対象外にするユーザーID（信頼できる管理者・他の管理ボット等）。
  # このボット自身とサーバーオーナーは常に対象外です。
  # 型: 整数のリスト / 既定: []
  whitelist_user_ids: []


# ============================================================
# ハニーポット設定
# ------------------------------------------------------------
# 罠チャンネルに投稿したユーザーを段階的に処罰します（乗っ取りアカウント対策）。
#   1〜max_kicks 回目 : そのユーザーの投稿を全削除 → キック
#   max_kicks+1 回目  : BAN（直近7日分のメッセージも削除）
# Kick/BAN 理由は「ハニーポット検知(n回目)」になります。
# 回数は data/ashchan.db に保存され、再参加しても累積します（/ash honeypot reset で消去）。
# 必要権限: メンバーをキック / メンバーをBAN / メッセージの管理 / メッセージ履歴を読む
# ============================================================
honeypot:
  # ハニーポット機能の ON/OFF。
  # 型: 真偽値 / 既定: true
  enabled: true

  # 罠にするチャンネルIDの一覧。空 [] の場合は作動しません。
  # チャンネル名を「書き込まないでください」などにしておくのが一般的です。
  # 型: 整数のリスト / 既定: []
  channel_ids: []

  # このロールを持つユーザーはハニーポットを回避できます（検知・カウントもしない）。
  # moderation.exempt_role_ids とは独立した設定です。
  # ボット・サーバーオーナーは常に対象外です。
  # 型: 整数のリスト / 既定: []
  exempt_role_ids: []

  # BAN までに許容するキック回数。3 なら 1〜3回目がキック、4回目でBAN。
  # 0 にすると初回からBANになります。
  # 型: 整数 / 既定: 3
  max_kicks: 3

  # 「全投稿削除」でさかのぼるチャンネル履歴の日数。
  # 大きいほど確実ですが、チャンネルが多いサーバーでは処理に時間がかかります。
  # 型: 整数 / 単位: 日 / 既定: 14
  purge_scan_days: 14


# ============================================================
# 自動ロール設定
# ------------------------------------------------------------
# サーバーに新しく参加したメンバーへ、指定したロールを自動で付与します。
# 必要権限: ロールの管理
# ※ ボットのロールは、付与するロールより「上」に配置してください。
#    （下にあるロール・連携ロールは付与できず、dev通知で知らせます）
# 必要Intent: SERVER MEMBERS INTENT
# ============================================================
autorole:
  # 自動ロール機能の ON/OFF。
  # 型: 真偽値 / 既定: false
  enabled: false

  # 新規参加した人間のメンバーに付与するロールIDの一覧（複数可）。
  # 型: 整数のリスト / 既定: []
  # 例: [123456789012345678]
  role_ids: []

  # 新規参加したボットに付与するロールIDの一覧。空 [] ならボットには付与しません。
  # 型: 整数のリスト / 既定: []
  bot_role_ids: []

  # サーバーで「メンバーシップ審査（ルールへの同意）」を使っている場合、
  # 審査を通過するまでロール付与を待つか。
  # true : 同意ボタンを押した時点で付与（審査をすり抜けさせない）
  # false: 参加した瞬間に付与
  # 審査を使っていないサーバーでは、どちらでも参加時に付与されます。
  # 型: 真偽値 / 既定: true
  wait_for_screening: true


# ============================================================
# ようこそメッセージ設定
# ------------------------------------------------------------
# 新しく参加したメンバーへ、アッシュの口調で 1〜3 行の挨拶を LLM で作って送ります。
# 通常のメッセージとして送るので、着地チャンネルを見られる全員に表示されます。
# 先頭で本人をメンションします（メンション通知が飛ぶのは本人だけです）。
# NIM がエラーのときや、短時間に大量参加があったときは定型文で挨拶します。
# 必要権限: 着地チャンネルでの「チャンネルを見る」「メッセージを送信」
# 必要Intent: SERVER MEMBERS INTENT
# ============================================================
welcome:
  # ようこそメッセージ機能の ON/OFF。
  # 型: 真偽値 / 既定: false
  enabled: false

  # 挨拶を送る着地チャンネルのID。
  # 0 の場合は、サーバー設定の「システムメッセージチャンネル」に送ります。
  # 型: 整数 / 既定: 0
  channel_id: 0

  # メンバーシップ審査（ルールへの同意）を使っている場合、通過してから挨拶するか。
  # true : 同意ボタンを押した時点で挨拶（同意せず抜ける人には挨拶しない）
  # false: 参加した瞬間に挨拶
  # 型: 真偽値 / 既定: true
  wait_for_screening: true

  # 挨拶の最大行数。LLM がこれより長く書いた場合は切り詰めます。
  # 型: 整数 / 既定: 3
  max_lines: 3

  # LLM への追加指示。サーバーの案内を挨拶に混ぜたいときに使います。
  # 空 "" なら追加指示なし。
  # 型: 文字列 / 既定: ""
  # 例: "質問は #help、自己紹介は #自己紹介 で受け付けていることを軽く案内する"
  extra_instructions: ""

  # 1分間に LLM で挨拶を作る最大回数。超えた分は定型文で挨拶します。
  # レイド（大量参加）時に NIM を呼びすぎないための上限です。0 なら常に定型文。
  # 型: 整数 / 既定: 5
  max_llm_per_minute: 5

  # LLM が使えないときにランダムで使う定型文。
  # {name} は参加者の表示名、{server} はサーバー名に置き換わります。
  # 空 [] にするとコード内蔵の既定文を使います。
  # 型: 文字列のリスト
  fallback_messages:
    - "{name}、いらっしゃい！ ゆっくりしてってね。"
    - "お、新しい人だ。{name}、{server} へようこそ！"
    - "{name}、来てくれてありがと。気楽にいこ！"


# ============================================================
# GitHub 通知（Webhook 受信）
# ------------------------------------------------------------
# GitHub の Issue / PR のコメント・状態変化、リリース、コミットを Discord チャンネルへ通知します。
# Issue は番号ごとに送信先チャンネルを分けられます。
# ボット内で小さな HTTP サーバーを起動し、GitHub からの Webhook を受け取ります。
#
# ■ GitHub 側の設定（リポジトリ → Settings → Webhooks → Add webhook）
#   Payload URL  : https://<公開URL><path>   例: https://ash.example.com/github/webhook
#   Content type : application/json
#   Secret       : 下の secret と同じ文字列
#   Events       : 「Let me select individual events」→ Issue comments / Issues / Releases
#                  （必要に応じて Pull requests / Pull request review comments / Pushes も）
#
# ■ 外部公開について
#   GitHub から届く必要があるので、次のどちらかが必要です。
#   - Cloudflare Tunnel / ngrok などのトンネル（host は 127.0.0.1 のままでOK・推奨）
#   - ルーターのポート開放（host を "0.0.0.0" にする）
#
# ※ host / port / path の変更は /ash reload で反映されます。
# ============================================================
github:
  # GitHub 通知機能の ON/OFF。
  # 型: 真偽値 / 既定: false
  enabled: false

  # 待ち受けるアドレス。トンネル利用なら "127.0.0.1"、ポート開放なら "0.0.0.0"。
  # 型: 文字列 / 既定: "127.0.0.1"
  host: "127.0.0.1"

  # 待ち受けるポート番号。他のソフトと被らない番号にしてください。
  # 型: 整数 / 既定: 8080
  port: 8080

  # Webhook を受け付けるパス。GitHub の Payload URL の末尾と一致させます。
  # 型: 文字列 / 既定: "/github/webhook"
  path: "/github/webhook"

  # Webhook の署名検証用シークレット（GitHub 側の Secret と同じ値）。
  # 未設定の場合、安全のためサーバーを起動しません。
  # ランダムな長い文字列を使ってください（例: PowerShell で [guid]::NewGuid()）。
  # ※ 絶対に公開しないでください
  # ※ 環境変数 GITHUB_WEBHOOK_SECRET が設定されていればそちらが優先されます
  # 型: 文字列 / 必須（enabled: true の場合）
  secret: ""

  # ----------------------------------------------------------
  # 送信先チャンネル
  # ----------------------------------------------------------
  # 振り分けの優先順位:
  #   Issue / PR（コメント・作成・クローズ・再オープン・マージ）
  #       issue_routes に番号が一致 → issue_channel_id → default_channel_id
  #   リリース
  #       release_channel_id → default_channel_id
  #   コミット（push）
  #       commit_channel_id → default_channel_id
  # どれも 0 / 未設定なら、その通知は送られません。

  # 上記で決まらなかった通知の送り先（最後の受け皿）。
  # 型: 整数 / 既定: 0
  default_channel_id: 0

  # issue_routes に当てはまらない Issue / PR の通知の送り先。
  # 型: 整数 / 既定: 0
  issue_channel_id: 0

  # 特定の Issue / PR 番号の通知を、専用チャンネルへ送るルール（上から順に判定）。
  # その番号へのコメントだけでなく、作成・クローズ・再オープン等のアクションも同じ送り先になります。
  #   numbers    : Issue / PR の番号のリスト（必須）
  #   channel_id : 送信先チャンネルID（必須）
  #   repo       : "owner/repo"。省略すると全リポジトリの同じ番号に適用（大文字小文字は無視）
  # 型: リスト / 既定: []
  # 例:
  #   issue_routes:
  #     - repo: "coffin299/AshChan"
  #       numbers: [11]
  #       channel_id: 123456789012345678
  #     - numbers: [20, 21, 22]
  #       channel_id: 234567890123456789
  issue_routes: []

  # リリース通知の送り先。
  # 型: 整数 / 既定: 0
  release_channel_id: 0

  # コミット（ブランチへの push）通知の送り先。
  # ※ events.push を true にし、GitHub 側で「Pushes」も選択してください。
  # 型: 整数 / 既定: 0
  commit_channel_id: 0

  # コミット通知の対象ブランチ名の一覧。空 [] なら全ブランチを通知します。
  # タグの push・ブランチ削除は通知しません。
  # 型: 文字列のリスト / 既定: []
  # 例: ["main", "develop"]
  commit_branches: []

  # ----------------------------------------------------------
  # 通知するイベント
  # GitHub 側の Webhook でも同じイベントを選択しておく必要があります。
  # （GitHub の表示名は右のコメント参照）
  # ----------------------------------------------------------
  events:
    # Issue / PR への通常コメント（新規投稿のみ）          … Issue comments
    issue_comment: true
    # Issue の作成・クローズ・再オープン                    … Issues
    issues: true
    # PR の作成・クローズ・マージ・再オープン               … Pull requests
    pull_request: false
    # PR の差分行へのレビューコメント                       … Pull request review comments
    pull_request_review_comment: false
    # リリースの公開（プレリリース含む・下書きは除く）      … Releases
    release: true
    # ブランチへのコミット push                             … Pushes
    push: false

  # ボットアカウント（dependabot 等）のコメント・操作を通知しないか。
  # ※ リリースは GitHub Actions が公開することが多いため、この設定に関係なく通知します。
  # 型: 真偽値 / 既定: true
  ignore_bots: true

  # 通知に載せるコメント・Issue 本文の最大文字数。超えた分は「…」で省略します。
  # 型: 整数 / 既定: 1000
  max_body_chars: 1000

  # 通知に載せるリリースノートの最大文字数。
  # 型: 整数 / 既定: 2000（埋め込みの上限は約4000）
  max_release_body_chars: 2000

  # 1回の push 通知に載せるコミットの最大件数。超えた分は「…ほか n 件」と表示します。
  # 型: 整数 / 既定: 10
  max_commits: 10


# ============================================================
# VRCast サポートフォーラム / RAG
# ------------------------------------------------------------
# Discord フォーラムへの投稿にアッシュがトラブルシューティングで応答します。
# ナレッジは coffin299/VRCast の docs + ソースを埋め込み検索します。
# 初回インデックスは bootstrap_rag.bat（LM Studio）または
# /ash rag rebuild-nim（NVIDIA NIM）を使います。
# ============================================================
support:
  # サポートフォーラム機能の ON/OFF。
  # 型: 真偽値 / 既定: false
  enabled: false

  # 対象フォーラムチャンネルIDの一覧。
  # 型: 整数のリスト / 既定: []
  forum_channel_ids: []

  # LLM 失敗時・「開発者に聞く」でメンションするユーザーID。
  # 型: 整数のリスト / 既定: []
  admin_user_ids: []

  # 解決時に付けるフォーラムタグ名（同名タグが無ければスキップ）。
  # 型: 文字列 / 既定: "解決済み"
  resolved_tag_name: "解決済み"

  # ナレッジ元リポジトリ（owner/name）。
  # 型: 文字列 / 既定: "coffin299/VRCast"
  repo: "coffin299/VRCast"

  # ローカルクローンのパス（bootstrap / rebuild 用）。空なら GitHub API。
  # 型: 文字列 / 既定: ""
  local_repo_path: ""

  # インデックス対象の glob（空ならコード既定）。
  # 型: 文字列のリスト
  include_globs: []

  # 除外 glob（空ならコード既定）。
  # 型: 文字列のリスト
  exclude_globs: []

  # 埋め込みモデル（運用・rebuild-nim 用）。
  # 型: 文字列 / 既定: "nvidia/nemotron-3-embed-1b"
  embedding_model: "nvidia/nemotron-3-embed-1b"

  # 埋め込み API のベースURL。空なら llm.base_url を使う。
  # 型: 文字列 / 既定: ""
  embedding_base_url: ""

  # 埋め込み API キー。空なら llm.api_key / NVIDIA_API_KEY を使う。
  # 環境変数 RAG_API_KEY があれば優先。
  # 型: 文字列 / 既定: ""
  embedding_api_key: ""

  # 検索で渡すチャンク数。
  # 型: 整数 / 既定: 8
  top_k: 8

  # チャンクのおおよその文字数。
  # 型: 整数 / 既定: 1200
  chunk_size: 1200

  # チャンク間の重なり文字数。
  # 型: 整数 / 既定: 150
  chunk_overlap: 150

  # 1回の embeddings リクエストに載せるチャンク数。
  # 型: 整数 / 既定: 8
  embed_batch_size: 8

  # embeddings の分間リクエスト上限（NIM 試用は 40）。
  # 型: 整数 / 既定: 40
  embed_rpm: 40

  # 1ファイルから読む最大文字数。
  # 型: 整数 / 既定: 200000
  max_file_chars: 200000

  # 添付 .txt / .log をプロンプトに入れる最大文字数。
  # 型: 整数 / 既定: 20000
  max_attachment_chars: 20000

  # サポート専用プロンプト（人格は llm.prompt_file と併用）。
  # 型: 文字列 / 既定: "prompt_support.md"
  prompt_file: "prompt_support.md"

  # この往復数を超えたら管理者ボタンを促す（プロンプト指示用）。
  # 型: 整数 / 既定: 6
  max_turns_before_hint: 6

  # 最新 Components V2 メッセージに載せる固定案内。
  # 型: 文字列
  footer_hint: "アッシュちゃんはコードベースから解決策を考えます。リプライで会話を続けるか、下記ボタンから開発者にエスカレーションしてください。"

  # LLM / RAG 失敗時の最大試行回数。
  # 型: 整数 / 既定: 3
  llm_retry_count: 3

  # 試行の間隔（秒）。
  # 型: 小数 / 既定: 30
  llm_retry_delay_sec: 30

  # ボタンラベル。
  resolve_button_label: "解決した"
  escalate_button_label: "開発者に聞く"


# ============================================================
# Discord ステータス（いま何してるか）
# ------------------------------------------------------------
# カスタムステータスに短文を出します。
# 優先度: RAGジョブ > サポート中 > 会話中 > 待機ローテーション
# サポートが複数フォーラムなら「サポート中/名前」を順にローテします。
# ============================================================
presence:
  # ステータス表示の ON/OFF。
  # 型: 真偽値 / 既定: true
  enabled: true

  # 文言を切り替える間隔（秒）。
  # 型: 小数 / 既定: 20
  rotate_sec: 20

  # 何もしていないときのローテーション文言。空 [] ならコード既定。
  # 型: 文字列のリスト
  idle_statuses:
    - "通常待機"
    - "暇だよ"
    - "VRCastのdocs眺めてる"
    - "ねむい…"

  # サポート応答中。{forum} がフォーラムチャンネル名に置き換わる。
  # 型: 文字列 / 既定: "サポート中/{forum}"
  support_template: "サポート中/{forum}"

  # 通常チャットの生成中。
  # 型: 文字列 / 既定: "会話中"
  chat_busy: "会話中"

  # RAG 全文 rebuild 中。
  # 型: 文字列 / 既定: "RAG再構築中"
  rag_rebuild: "RAG再構築中"

  # RAG 差分 sync 中。
  # 型: 文字列 / 既定: "RAG更新中"
  rag_sync: "RAG更新中"


# ============================================================
# FixLink 設定
# ------------------------------------------------------------
# Twitter/X などのリンクを、埋め込みが正しく表示されるサービス
# （fxtwitter.com 等）のURLに置き換えて返信します。
# 必要権限: メッセージの管理（元投稿の埋め込みを消す場合）
# ============================================================
fixlink:
  # FixLink 機能の ON/OFF。
  # 型: 真偽値 / 既定: true
  enabled: true

  # 置換リンクを返信したあと、元投稿の埋め込みを非表示にするか。
  # 権限が無い場合は返信のみ行います。
  # 型: 真偽値 / 既定: true
  suppress_original_embed: true

  # FixLink を動かさないチャンネルIDの一覧。
  # 型: 整数のリスト / 既定: []
  ignore_channel_ids: []

  # 置換ルール。pattern（ホスト部分の正規表現）に一致した URL のホストを replace に置換します。
  # path_pattern を指定すると、パスがその正規表現に一致するときだけ置換します。
  # 使いたいルールの行頭の "# " を外すと有効になります。
  rules:
    - pattern: '(?:www\.|mobile\.)?(?:twitter|x)\.com'
      replace: 'fxtwitter.com'
      path_pattern: '^/[^/]+/status/\d+'
    # - pattern: '(?:www\.)?instagram\.com'
    #   replace: 'ddinstagram.com'
    #   path_pattern: '^/(?:p|reel|reels)/'
    # - pattern: '(?:www\.|vm\.)?tiktok\.com'
    #   replace: 'vxtiktok.com'
    # - pattern: '(?:www\.)?pixiv\.net'
    #   replace: 'phixiv.net'
    #   path_pattern: '^/(?:en/)?artworks/\d+'
